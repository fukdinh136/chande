# Generated values come from edgeSizing() in stack.cjs (EDGE_PEAK_DRIVERS): each proxied WebSocket holds two
# connections. Two workers match the pod's 2 CPU limit; every worker can hold the whole peak on its own.
worker_processes 2;
worker_rlimit_nofile __RLIMIT_NOFILE__;
events { worker_connections __WORKER_CONNECTIONS__; }
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8088;
    client_max_body_size 256k;
    location = /health/live { access_log off; return 200 'ok'; }
    location /api/v1/ {
      proxy_pass http://gateway-api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      # Real client IP for Gateway rate limits. Overwrite, never append: a client-sent X-Forwarded-For is dropped.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 20s;
    }
    location = /ws {
      proxy_pass http://gateway-api:8080;
      proxy_http_version 1.1;
      # Real client IP for Gateway rate limits. Overwrite, never append: a client-sent X-Forwarded-For is dropped.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 75s;
    }
    location /socket.io/ {
      proxy_pass http://realtime-api:3006;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 75s;
    }
    location / { return 404; }
  }
}
