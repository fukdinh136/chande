plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'com.chande.navigation'
version = '1.0.0'
android { namespace "expo.modules.veloxnavigation"
  defaultConfig { versionCode 1; versionName "1.0.0" }
}
dependencies {
  implementation('org.maplibre.navigation:navigation-core:5.0.0-pre13') {
    // Renderer supplies android-sdk-opengl13.6.1. A second12.3.1 libmaplibre.so cannot coexist.
    exclude group: 'org.maplibre.gl', module: 'android-sdk'
  }
}
