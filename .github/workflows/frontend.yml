name: Frontend Contracts
on:
  push:
    paths: ['app/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/frontend.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24.15.0', cache: npm, cache-dependency-path: app/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx expo export --platform android --output-dir artifacts/android-bundle
        env: {CI: '1', APP_VARIANT: customer}
      - run: npm run typecheck
