name: Routing Service
on:
  push:
    paths: ['service/routing-service/**', 'service/trip-service/**', '.github/workflows/routing-service.yml']
  pull_request:
    paths: ['service/routing-service/**', 'service/trip-service/**', '.github/workflows/routing-service.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service/routing-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24.15.0', cache: npm, cache-dependency-path: service/routing-service/package-lock.json}
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run docs:check
      - run: npm run test:all
      - run: npm run build
      - run: npm --prefix ../trip-service ci
      - run: npm run test:trip
      - run: npm --prefix ../trip-service run test:contract
      - run: npm audit --omit=dev --audit-level=moderate
      - run: docker build -t chande-routing:local .
      - run: npm run smoke:docker
