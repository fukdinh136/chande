name: chande-trip-local
x-app: &app
  image: chande-trip:local
  build: .
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 45s
x-environment: &environment
  NODE_ENV: development
  INTEGRATION_MODE: mock
  DATABASE_URL: postgres://trip_local:trip_local@trip-db:5432/trip_local
  SUPPORTED_VEHICLE_TYPES: MOCK_BIKE
  AUTH_JWKS_URL: http://trip-mocks:3003/jwks
  AUTH_JWT_ISSUER: chande-local
  AUTH_JWT_AUDIENCE: trip-service
  CURSOR_SIGNING_KEY: local-only-cursor-key-change-in-production
  MATCHING_CALLBACK_TOKEN: local-callback
  ROUTING_BASE_URL: http://trip-mocks:3003
  PRICING_BASE_URL: http://trip-mocks:3003
  MATCHING_BASE_URL: http://trip-mocks:3003
  GATEWAY_EVENTS_BASE_URL: http://trip-mocks:3003
  NOTIFICATION_BASE_URL: http://trip-mocks:3003
  ROUTING_TOKEN: local-routing
  PRICING_TOKEN: local-pricing
  MATCHING_TOKEN: local-matching
  GATEWAY_EVENTS_TOKEN: local-gateway
  NOTIFICATION_TOKEN: local-notification
  SWAGGER_ENABLED: 'true'
services:
  trip-db:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment: {POSTGRES_USER: trip_local, POSTGRES_PASSWORD: trip_local, POSTGRES_DB: trip_local}
    ports: ['127.0.0.1:55433:5432']
    volumes: [trip-data:/var/lib/postgresql]
    healthcheck: {test: [CMD-SHELL, 'pg_isready -U trip_local -d trip_local'], interval: 3s, timeout: 3s, retries: 20}
  trip-migrate:
    <<: *app
    command: [npm, run, migration:run]
    environment: *environment
    depends_on: {trip-db: {condition: service_healthy}}
  trip-mocks:
    <<: *app
    command: [node, dist/mock.js]
    environment: {<<: *environment, MOCK_TRIP_API_URL: 'http://trip-api:3001'}
    ports: ['127.0.0.1:3003:3003']
    volumes: [mock-data:/app/.mock-data]
    healthcheck: {test: [CMD, node, -e, "fetch('http://127.0.0.1:3003/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, timeout: 3s, retries: 20}
  trip-api:
    <<: *app
    environment: *environment
    read_only: true
    tmpfs: [/tmp]
    ports: ['127.0.0.1:3001:3001']
    depends_on: {trip-migrate: {condition: service_completed_successfully}, trip-mocks: {condition: service_healthy}}
    healthcheck: {test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, timeout: 3s, retries: 20, start_period: 10s}
  trip-worker:
    <<: *app
    command: [node, dist/worker.js]
    environment: *environment
    read_only: true
    tmpfs: [/tmp]
    ports: ['127.0.0.1:3002:3002']
    depends_on: {trip-migrate: {condition: service_completed_successfully}, trip-mocks: {condition: service_healthy}}
    healthcheck: {test: [CMD, node, -e, "fetch('http://127.0.0.1:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, timeout: 3s, retries: 20, start_period: 30s}
volumes:
  trip-data:
  mock-data:
