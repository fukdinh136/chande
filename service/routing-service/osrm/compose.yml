name: chande-osrm
services:
  osrm:
    image: chande-osrm:local
    build: {context: ., target: runtime}
    command: [osrm-routed, --algorithm, mld, --threads, '2', --max-table-size, '100', /data/hanoi.osrm]
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 1g
    stop_grace_period: 10s
    ports: ['127.0.0.1:5000:5000']
    volumes: [{type: bind, source: ./data/hanoi-car, target: /data, read_only: true, bind: {create_host_path: false}}]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '2', 'http://127.0.0.1:5000/route/v1/driving/105.8542,21.0285;105.8355,21.0272?overview=false']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
networks:
  default: {name: chande-osrm}
