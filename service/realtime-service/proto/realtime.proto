// Realtime internal API. Mirrors GET /internal/realtime/driver-locations (caller: Matching).
syntax = "proto3";
package chande.realtime.v1;

service RealtimeInternal {
  // Fresh raw driver locations around a point, nearest first (ADR-0001).
  rpc ListDriverLocations(DriverLocationsRequest) returns (DriverLocations);
}

message DriverLocationsRequest {
  double latitude = 1;
  double longitude = 2;
  optional int32 radius_meters = 3;
  optional int32 limit = 4;
}

message DriverLocation {
  string driver_id = 1;
  double latitude = 2;
  double longitude = 3;
  double distance_meters = 4;
  string recorded_at = 5;
}

message DriverLocations {
  int32 radius_meters = 1;
  repeated DriverLocation drivers = 2;
}
