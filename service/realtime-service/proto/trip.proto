// Trip internal API. Mirrors POST /internal/trips/{id}/assignment and GET /internal/trips/{id}/matching-state
// (caller: Matching), POST /internal/trips/active-drivers/batch and GET /trips/active (caller: Driver).
syntax = "proto3";
package chande.trip.v1;
import "common.proto";

service TripInternal {
  rpc AssignTrip(AssignTripRequest) returns (AssignTripReply);
  rpc GetMatchingState(TripRef) returns (MatchingState);
  rpc ActiveDriverTrips(chande.common.v1.DriverIds) returns (chande.common.v1.DriverTrips);
  // The caller's own active trip. Needs the driver's `authorization` metadata (Bearer JWT), not a service token.
  rpc GetActiveTrip(ActiveTripRequest) returns (ActiveTripReply);
}

message AssignTripRequest {
  string trip_id = 1;
  string event_id = 2;
  string driver_id = 3;
  string vehicle_id = 4;
  chande.common.v1.DriverSnapshot driver_snapshot = 5;
  chande.common.v1.VehicleSnapshot vehicle_snapshot = 6;
}

message AssignTripReply {
  string event_id = 1;
  string trip_id = 2;
  bool accepted = 3;
  int32 assigned_version = 4;
}

message TripRef {
  string trip_id = 1;
}

// `found` false matches `data: null` in the HTTP API.
message MatchingState {
  bool found = 1;
  string trip_id = 2;
  string status = 3;
  optional string driver_id = 4;
  int32 version = 5;
}

message ActiveTripRequest {}

message ActiveTrip {
  string trip_id = 1;
  optional string vehicle_id = 2;
  string status = 3;
  int32 version = 4;
}

message ActiveTripReply {
  optional ActiveTrip trip = 1;
}
