spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/user_service_db
    username: postgres
    password: "123456"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    # Cấu trúc bảng do Flyway quản lý (src/main/resources/db/migration).
    # DB đã có bảng tạo bằng SQL tay → đánh dấu là version 1 (V1 không chạy lại), chỉ chạy V2 trở đi.
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:k69i-ride-hailing-dev-secret-key-2026-change-me}
  issuer: user-service
  access-token-ttl: 15m
  refresh-token-ttl: 30d

internal:
  api-key: ${INTERNAL_API_KEY:k69i-internal-dev-key-2026}

logging:
  level:
    org.springframework.security: DEBUG